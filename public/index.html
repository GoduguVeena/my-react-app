<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4A90E2" />

    <!-- Primary Meta Tags -->
    <title>Your App Name – A Tagline Describing What It Does</title>
    <meta name="title" content="Your App Name – A Tagline Describing What It Does" />
    <meta
      name="description"
      content="A clear, concise description of your application to boost search engine visibility and improve user CTR."
    />

    <!-- Favicons & Mobile Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:title" content="Your App Name" />
    <meta property="og:description" content="A clear, concise description of your application." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://yourdomain.com/" />
    <meta property="twitter:title" content="Your App Name" />
    <meta property="twitter:description" content="A clear, concise description of your application." />
    <meta property="twitter:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Font & Asset Preconnections (Example: Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Main React Mount Point -->
    <div id="root"></div>
  </body>
</html>
